name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  offline:
    name: 离线测试（零网络依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行离线测试
        run: node tests/run-all.js --quick
