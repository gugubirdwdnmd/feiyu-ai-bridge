appId: com.feiyu.desktop
productName: 肥鱼桌面控制中心
files:
  - src/**/*
  - renderer/**/*
  - package.json
directories:
  output: dist
  buildResources: build
win:
  target:
    - nsis
    - portable
  arch:
    - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 卸载时不删除用户数据（%APPDATA%/肥鱼桌面控制中心：设置、价格表等），
  # 升级/卸载保留配置；机器人侧的 memory/日志/密钥本就不在安装目录内。
  deleteAppDataOnUninstall: false
portable:
  artifactName: 肥鱼桌面控制中心-${version}-portable.${ext}
